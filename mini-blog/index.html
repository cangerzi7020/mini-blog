<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniBlog — 记录此刻想法</title>
  <meta name="description" content="MiniBlog 是一个极简的本地记录小站，内容仅保存在当前浏览器，发布即记录。" />
  <meta name="theme-color" content="#1d9bf0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d9bf0'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">M</span>
        <span class="brand-name">MiniBlog</span>
      </div>
      <p class="brand-slogan">记录此刻的想法</p>
    </div>
  </header>

  <main class="container">
    <!-- 发布区 -->
    <section class="composer card" aria-label="发布新内容">
      <div class="composer-row">
        <div class="avatar" aria-hidden="true">我</div>
        <textarea
          id="compose-input"
          class="composer-input"
          rows="3"
          aria-label="内容输入框，最多 140 字"
          placeholder="此刻有什么想法？"
        ></textarea>
      </div>
      <p id="compose-error" class="composer-error" role="alert" hidden></p>
      <div class="composer-footer">
        <span id="char-count" class="char-count">0 / 140</span>
        <button id="publish-btn" class="btn-primary" type="button">发布</button>
      </div>
    </section>

    <!-- 帖子流 -->
    <section class="feed" aria-label="内容列表">
      <div id="post-list" class="post-list" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✦</div>
        <p class="empty-title">还没有内容</p>
        <p class="empty-desc">写下第一条想法，开启你的记录之旅吧</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>MiniBlog · 一个极简的本地记录小站</p>
  </footer>
</body>
</html>
